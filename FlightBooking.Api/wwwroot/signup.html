<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign up — Flyora</title><link rel="stylesheet" href="/css/styles.css"></head>
<body class="auth-page"><main class="auth-shell"><a class="brand" href="/index.html"><span>✈</span> Flyora</a><section class="auth-card signup-card"><div class="auth-side"><span class="eyebrow">JOIN FLYORA</span><h1>Make every journey yours.</h1><p>Create an account to save favourites, manage bookings and unlock a smoother checkout.</p></div><div class="auth-form"><h2>Create account</h2><form id="signupForm">
<div class="two-col"><label>Username<input id="username" required maxlength="30"></label><label>First name<input id="firstName" required maxlength="50"></label></div>
<div class="two-col"><label>Last name<input id="lastName" required maxlength="50"></label><label>Date of birth<input id="dob" type="date" required></label></div>
<div class="two-col"><label>Phone<input id="phone" inputmode="numeric" required maxlength="15"></label><label>Gmail<input id="email" type="email" placeholder="you@gmail.com" required></label></div>
<label>Password<input id="password" type="password" minlength="6" maxlength="12" required><small>6–12 characters</small></label>
<div class="captcha"><div id="captchaQuestion">Loading…</div><input id="captchaAnswer" placeholder="Answer" required></div>
<button class="btn btn-primary full">Create account</button><div id="message" class="message"></div></form><div class="auth-links"><a href="/login.html">Already have an account? Login</a></div></div></section></main><script src="/js/auth.js"></script></body></html>
