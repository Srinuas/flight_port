<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password — Flyora</title><link rel="stylesheet" href="/css/styles.css"></head>
<body class="auth-page"><main class="auth-shell"><a class="brand" href="/index.html"><span>✈</span> Flyora</a><section class="auth-card"><div class="auth-side"><span class="eyebrow">ACCOUNT RECOVERY</span><h1>Back in the air.</h1><p>Verify your Gmail/username and registered phone number, then create a new password.</p></div><div class="auth-form"><h2>Reset password</h2><form id="forgotForm">
<label>Gmail or username<input id="identifier" required></label><label>Registered phone<input id="phone" required maxlength="15"></label><label>New password<input id="password" type="password" minlength="6" maxlength="12" required></label>
<div class="captcha"><div id="captchaQuestion">Loading…</div><input id="captchaAnswer" placeholder="Answer" required></div>
<button class="btn btn-primary full">Reset password</button><div id="message" class="message"></div></form><div class="auth-links"><a href="/login.html">Back to login</a></div></div></section></main><script src="/js/auth.js"></script></body></html>
